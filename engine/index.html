<!doctype html>
<html><head><meta charset="utf-8"><title>Blueprint Shorts</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/Inter-Black.otf') format('opentype'); }
@font-face { font-family: 'Mono'; font-weight: 700; src: url('fonts/JetBrainsMono-Bold.woff') format('woff'); }
@font-face { font-family: 'Scrawl'; font-weight: 400; src: url('fonts/CaveatBrush.woff') format('woff'); }
html, body { margin: 0; background: #05060A; height: 100%; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; height: 100vh; width: auto; max-width: 100vw; object-fit: contain; }
body.capture canvas { height: auto; width: auto; }
#play { position: fixed; font: 900 28px Inter, sans-serif; padding: 18px 36px; border: 0; border-radius: 40px; background: #5EF2B0; color: #0A0C12; cursor: pointer; }
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<button id="play" hidden>▶ PLAY</button>
<script>if (location.search.includes('capture')) document.body.className = 'capture';</script>
<script type="module" src="src/main.js"></script>
</body></html>
